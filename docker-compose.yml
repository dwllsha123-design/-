services:
  api:
    build:
      context: ./backend
    env_file:
      - deploy/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/data/app.db
      PORT: 3000
    volumes:
      - sqlite_data:/data
      - uploads_data:/app/uploads
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 25s

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_API_URL: /api/v1
        VITE_BASE: /admin/
    ports:
      - "80:80"
    volumes:
      - uploads_data:/var/www/uploads
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlite_data:
  uploads_data:
