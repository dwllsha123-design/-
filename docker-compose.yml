# Low-resource VPS stack: Nginx (static) + Nest API + SQLite
# No PostgreSQL/Redis containers — keeps RAM under ~700MB at idle.

services:
  api:
    build:
      context: ./backend
    env_file:
      - deploy/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/data/app.db
      PORT: "3000"
      NODE_OPTIONS: --max-old-space-size=384
      PRISMA_CLI_BINARY_TARGETS: debian-openssl-3.0.x
    volumes:
      - sqlite_data:/data
      - uploads_data:/app/uploads
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_API_URL: /api/v1
        VITE_BASE: /admin/
    ports:
      - "80:80"
    volumes:
      - uploads_data:/var/www/uploads
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "2"

volumes:
  sqlite_data:
  uploads_data:
